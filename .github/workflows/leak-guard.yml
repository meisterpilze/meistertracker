name: Leak guard

# Catch the address of a live instance on the surfaces that actually leak.
#
# Prose lets one slip through more easily than a file does. So the interesting job
# is not the one that reads the tree — `npm test` already does that — it is the
# one that reads titles, bodies and comments, which nothing else ever looked at.

on:
  # Prose surfaces. `pull_request_target` rather than `pull_request` on purpose;
  # see the note on the prose job below.
  pull_request_target:
    types: [opened, edited, reopened]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  # Code surfaces.
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Nothing is granted by default; each job asks for exactly what it uses.
permissions: {}

# A run may be cancelled only by a newer run over the same text, so the group
# names both the trigger and the thing it reads.
#
# The trigger, because opening a pull request fires `pull_request` and
# `pull_request_target` at the same moment. Keyed on the number alone, the later
# of the two cancelled the earlier, and that pull request's commit messages, or
# its title and body, were never scanned.
#
# The thing, as narrowly as each run reads it. A newer run over a pull request
# or an issue reads the whole of it again — the full body, the full
# `base..head` — so a second edit or push may cancel the first. A comment or
# review run reads that one comment or review, and a push run only its own
# `before..after`; nothing later covers either, so each gets a group of its own.
# A review with several inline comments fires them all in the same second.
concurrency:
  group: leak-guard-${{ github.event_name }}-${{ github.event.comment.id || github.event.review.id || github.event.pull_request.number || github.event.issue.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Titles, bodies, comments and reviews — the surfaces that leak.
  #
  # On the `pull_request_target` trigger: ci.yml deliberately avoids it, and that
  # reasoning still holds there, because ci.yml checks out and executes pull
  # request code. This job does neither. It checks out main, never the head ref,
  # never runs `npm ci` (the scanner has no dependencies), and reads nothing but
  # the event payload. What it gains is the reason a guard needs it at all: a
  # `pull_request` workflow runs in the version from the contributor's branch,
  # so the person it is meant to check can edit or delete it. `pull_request_target`
  # always runs the copy on main.
  #
  # The two review triggers have no `_target` twin. GitHub runs them from the
  # pull request's merge commit, so for them this file is the pull request's
  # own copy, and on a pull request from a fork the token is read-only. The
  # checkout below still takes main, so the scanner and the code that decides
  # what to redact are main's on every trigger. What a fork's review run cannot
  # do is write: it fails, and the redaction is left to a maintainer.
  prose:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'issues' ||
      github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request_review_comment' ||
      github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Main, by name. Left to itself, the checkout would take the pull
      # request's merge commit on the review triggers, and the scanner that ran
      # would be the contributor's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # All of it lives in scripts/leak-guard-prose.js — main's copy, from the
      # checkout above — where the tests can reach it.
      - name: Scan and redact
        uses: actions/github-script@v7
        with:
          script: |
            const { guardProse } = require(`${process.env.GITHUB_WORKSPACE}/scripts/leak-guard-prose.js`);
            await guardProse({ github, context, core });

  # Files and commit messages. `npm test` covers the tree as well, on purpose —
  # this job repeats it so the guard still holds if that test is ever changed.
  content:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan tracked files
        run: git ls-files -z | xargs -0 node scripts/leak-scan.js --files

      # A surface that can leak as well, and the one nothing else checks.
      - name: Scan commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          zero=$(git hash-object --stdin </dev/null | tr '[0-9a-f]' '0')
          if [ -z "$BASE" ] || [ "$BASE" = "$zero" ]; then
            # First push of a branch, or a force-push that dropped the old tip.
            node scripts/leak-scan.js --range "$HEAD" --not --remotes=origin
          else
            node scripts/leak-scan.js --range "$BASE..$HEAD"
          fi
