name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# S-21: the default GITHUB_TOKEN is read-write on a repository that has not said
# otherwise. Nothing in this workflow writes anything, so it gets a read-only
# token — which is what limits the damage if any step ever executes code from a
# pull request (npm ci runs install scripts, and the audit and license steps
# read the dependency tree). The trigger is `pull_request`, not
# `pull_request_target`, so a fork's token is already read-only and untrusted
# code never sees a privileged one; this is the belt to that pair of braces.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Otherwise the checkout leaves the token in .git/config for every
          # later step — and for anything those steps run — to pick up.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail on HIGH or CRITICAL transitive vulns. Moderate findings only
      # warn (audit output is still printed). Run `npm audit fix` locally
      # when this step fails.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Fail if any production dep ships a license outside the AGPL-3.0
      # compatible allowlist in package.json. Update the allowlist there
      # if a new dep introduces a permissive license that's still safe.
      - name: License check
        run: npm run license-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Part of `npm test` below, but called out as its own step so an
      # untranslated key reads as "Translations complete: failed" in the checks
      # list instead of hiding inside a 280-test run. A missing translation is
      # invisible in review — the language you read looks finished — so it needs
      # to be loud here.
      - name: Translations complete
        run: node --test test/i18n.test.js

      # Same blindness as the translation step above, different symptom: type
      # that is too small does not throw, it just ships, and nobody reviewing
      # the diff is holding a phone. Called out separately so "Mobile size
      # system: failed" is readable in the checks list.
      - name: Mobile size system
        run: node --test test/mobile-tokens.test.js

      # The drill-down's behaviour lives in four files that cannot see each
      # other — the strip's home page, its translation, the two states in CSS,
      # and the class in JS. Edit one alone and the back row reads a raw i18n
      # key or the strip scrolls sideways again; neither throws.
      - name: Mobile navigation
        run: node --test test/mobile-nav.test.js

      # Below 769px a table row becomes a card, and the layout reads two
      # structural facts off the markup: the first cell is the header, and the
      # cell with no data-mlabel is the button row. A renderer that forgets a
      # label therefore does not lose a label — it turns a data cell into the
      # card's buttons, full width and ruled off. Nothing throws and the
      # desktop table is unaffected, so this needs to be loud here.
      - name: Mobile table cards
        run: node --test test/table-cards.test.js

      # The agenda list's grouping is shared between the phone view and the
      # printed task list, so a change made for one silently reaches the other.
      # Same blindness as the two steps above: wrong output, no error.
      - name: Calendar agenda
        run: node --test test/calendar-agenda.test.js

      # Ratchet, not a gate: the inline font sizes and sub-floor mobile rules
      # are paid down over several phases, and this only fails when the count
      # goes UP. All three now read 0 — it fails if any of them comes back.
      # See MOBILE_REDESIGN.md.
      - name: Mobile debt ratchet
        run: npm run mobile-audit

      - name: Tests
        run: npm test

  # ── The two halves that no test on a developer's Mac can reach ─────────────
  #
  # The DuckDNS fallback is installed by a systemd unit on Linux and a scheduled
  # task on Windows, and neither exists on the machine this is usually written
  # on. Both were therefore shipped on reasoning alone: the unit's quoting was
  # dry-run through sed and eyeballed, and the PowerShell was never even parsed.
  # That is the wrong place to be relying on judgement — an installer that fails
  # is an installer nobody notices has failed, because its whole job is to be
  # there during an outage.
  #
  # These two jobs run the real thing on real runners. They are cheap, and they
  # keep working after today.

  scheduler-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Shell static analysis
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/install-duckdns-fallback.sh update_server.sh

      # The deployment path deliberately contains a space. An unquoted
      # __MT_DIR__ in ExecStart or ReadWritePaths produces a unit that systemd
      # accepts, enables and then fails to run — while the installer reports
      # success. That combination is invisible without actually starting it.
      - name: Install the fallback timer from a path containing a space
        run: |
          set -eux
          DEPLOY="/opt/meister tracker"
          sudo mkdir -p "$DEPLOY"
          sudo cp -r duckdns.js db.js scripts "$DEPLOY/"
          sudo chown -R "$USER:$USER" "$DEPLOY"
          # setup-node puts node on this step's PATH only, not in a login shell
          # or in root's. How the installer discovers node is environment
          # specific and not what this job is about, so make it findable.
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          # A real database, built by the real migrations.
          node -e "require('$DEPLOY/db.js').openDb('$DEPLOY/meistertracker.db').close()"
          sudo bash "$DEPLOY/scripts/install-duckdns-fallback.sh"

      - name: systemd accepts the generated unit
        run: sudo systemd-analyze verify /etc/systemd/system/meistertracker-duckdns.service

      - name: The timer is enabled and active
        run: |
          set -eux
          systemctl is-enabled meistertracker-duckdns.timer
          systemctl is-active meistertracker-duckdns.timer
          systemctl list-timers meistertracker-duckdns.timer --all

      # DuckDNS is unconfigured here, so the correct behaviour is to stand down
      # and exit 0 without touching the network. A unit that cannot start at all
      # — wrong node, a split ExecStart, a sandbox denial — fails here instead.
      - name: The job actually runs under the sandbox
        run: |
          set -eux
          sudo systemctl start meistertracker-duckdns.service
          systemctl show meistertracker-duckdns.service -p Result -p ExecMainStatus
          sudo journalctl -u meistertracker-duckdns.service --no-pager -n 30
          test "$(systemctl show meistertracker-duckdns.service -p Result --value)" = "success"

      - name: Uninstalling leaves nothing behind
        run: |
          set -eux
          sudo bash "/opt/meister tracker/scripts/install-duckdns-fallback.sh" --uninstall
          test ! -f /etc/systemd/system/meistertracker-duckdns.timer
          test ! -f /etc/systemd/system/meistertracker-duckdns.service

      # A mistyped --uninstall used to fall through to a full install.
      - name: An unknown argument is refused, not installed
        run: |
          set -eu
          if sudo bash "/opt/meister tracker/scripts/install-duckdns-fallback.sh" --uninstal; then
            echo "expected a non-zero exit for an unknown argument" >&2
            exit 1
          fi
          test ! -f /etc/systemd/system/meistertracker-duckdns.timer

  scheduler-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # It had never been parsed. A typo in this file surfaces on somebody's
      # machine, at a UAC prompt, in a window that closes.
      - name: PowerShell parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install-duckdns-fallback.ps1), [ref]$null, [ref]$errors) > $null
          if ($errors.Count) { $errors | ForEach-Object { $_.Message }; exit 1 }
          'parsed clean'

      - name: PowerShell static analysis
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Import-Module PSScriptAnalyzer
          $r = Invoke-ScriptAnalyzer -Path .\install-duckdns-fallback.ps1 -Severity Error,Warning
          $r | Format-Table -AutoSize | Out-String | Write-Host
          if ($r | Where-Object { $_.Severity -eq 'Error' }) { exit 1 }

      # The finding this exists for: -RepetitionInterval without an explicit
      # -RepetitionDuration was reported to register, on some builds, as a
      # single run that never repeats — while Get-ScheduledTaskInfo still
      # reports success from that one run. Reading the registered XML back is
      # the only way to know, and on windows-latest the answer is that the
      # repetition survives with an empty Duration, which is what the schema
      # means by "indefinitely". Spelling it out was measured to be worse:
      # [TimeSpan]::MaxValue becomes P99999999DT23H59M59S and is rejected.
      # This step is what keeps that answer true.
      - name: Registering the task really produces a repeating trigger
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          $me   = "$env:USERDOMAIN\$env:USERNAME"
          # $ErrorActionPreference is Stop inside the script, so a failure
          # throws and fails this step. $LASTEXITCODE is unreliable after a
          # script that ends without calling exit, so it is not consulted.
          .\install-duckdns-fallback.ps1 -Elevated -NoPause -TargetUser $me -TargetNode $node

          [xml]$xml = Export-ScheduledTask -TaskName MeisterTrackerDuckDNS
          $xml.OuterXml | Write-Host

          $rep = $xml.Task.Triggers.TimeTrigger.Repetition
          # The installer checks this too, on the machine it runs on. Asserting
          # it here as well is what turns "it worked on that build" into a
          # standing claim about windows-latest.
          if (-not $rep)                { throw 'the time trigger has no repetition — it would run once and stop' }
          if ($rep.Interval -ne 'PT5M') { throw "interval is '$($rep.Interval)', expected PT5M" }
          Write-Host "repetition duration as registered: '$($rep.Duration)' (empty means indefinite)"

          # The privilege posture the documentation promises. Task Scheduler
          # omits <RunLevel> entirely when it is LeastPrivilege, so absence is
          # the confirmation; only HighestAvailable would appear.
          $runLevel = $xml.Task.Principals.Principal.RunLevel
          if ($runLevel -and $runLevel -ne 'LeastPrivilege') {
            throw "task runs as '$runLevel', expected LeastPrivilege (or no RunLevel element at all)"
          }
          if ($xml.Task.Principals.Principal.LogonType -ne 'S4U') {
            throw "logon type is $($xml.Task.Principals.Principal.LogonType), expected S4U"
          }
          # And it must point at the node this account can actually read.
          if ($xml.Task.Actions.Exec.Command -ne $node) {
            throw "task runs '$($xml.Task.Actions.Exec.Command)', expected '$node'"
          }
          'registered as expected'

      - name: Uninstalling removes it
        shell: pwsh
        run: |
          .\install-duckdns-fallback.ps1 -Elevated -NoPause -Uninstall
          if (Get-ScheduledTask -TaskName MeisterTrackerDuckDNS -ErrorAction SilentlyContinue) {
            throw 'task still registered after uninstall'
          }
          'removed'
