name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail on HIGH or CRITICAL transitive vulns. Moderate findings only
      # warn (audit output is still printed). Run `npm audit fix` locally
      # when this step fails.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Fail if any production dep ships a license outside the AGPL-3.0
      # compatible allowlist in package.json. Update the allowlist there
      # if a new dep introduces a permissive license that's still safe.
      - name: License check
        run: npm run license-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Part of `npm test` below, but called out as its own step so an
      # untranslated key reads as "Translations complete: failed" in the checks
      # list instead of hiding inside a 280-test run. A missing translation is
      # invisible in review — the language you read looks finished — so it needs
      # to be loud here.
      - name: Translations complete
        run: node --test test/i18n.test.js

      - name: Tests
        run: npm test
